{% extends "base.html" %}

{% block head %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Analysis Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Then load our custom CSS files -->
<link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
<link rel="stylesheet" href="{{url_for('static', filename='css/dashboard.css')}}">
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
{% endblock %}

{% block content %}
<div class="container-fluid my-4" >
    <h2 class="mb-4" style="margin-top: 100px;" >Data Analysis Dashboard</h2>
    
    <!-- Visualization Type Selector -->
    <div class="viz-type-selector">
        <button class="btn btn-outline-primary viz-type-btn active" data-type="all">
            All Visualizations
        </button>
        <button class="btn btn-outline-primary viz-type-btn" data-type="heatmap">
            Correlation Heatmap
        </button>
        <button class="btn btn-outline-primary viz-type-btn" data-type="histogram">
            Distributions
        </button>
        <button class="btn btn-outline-primary viz-type-btn" data-type="box">
            Box Plots
        </button>
        <button class="btn btn-outline-primary viz-type-btn" data-type="bar">
            Bar Charts
        </button>
        <button class="btn btn-outline-primary viz-type-btn" data-type="custom">
            Custom Visualization
        </button>
    </div>
    
    <!-- Custom Visualization Form -->
    <div class="custom-viz-form" id="customVizForm" style="display: none;">
        <h4>Create Custom Visualization</h4>
        <form class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Dimension</label>
                <select class="form-select" id="dimension">
                    <option value="2d">2D</option>
                    <option value="3d">3D</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Plot Type</label>
                <select class="form-select" id="plotType">
                    <option value="scatter">Scatter Plot</option>
                    <option value="line">Line Plot</option>
                    <option value="bar">Bar Plot</option>
                    <option value="box">Box Plot</option>
                    <option value="violin">Violin Plot</option>
                    <option value="heatmap">Heatmap</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">X-Axis</label>
                <select class="form-select" id="xColumn">
                    {% for col in columns %}
                    <option value="{{ col }}">{{ col }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Y-Axis</label>
                <select class="form-select" id="yColumn">
                    {% for col in numerical_columns %}
                    <option value="{{ col }}">{{ col }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2" id="zAxisContainer" style="display: none;">
                <label class="form-label">Z-Axis</label>
                <select class="form-select" id="zColumn">
                    {% for col in numerical_columns %}
                    <option value="{{ col }}">{{ col }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <button type="submit" class="create-viz-btn">
                    <span>
                        <svg
                        height="24"
                        width="24"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                        >
                        <path d="M0 0h24v24H0z" fill="none"></path>
                        <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z" fill="currentColor"></path>
                        </svg>
                        Create
                    </span>
                </button>
            </div>
        </form>
    </div>

    <!-- Visualizations Grid -->
    <div class="row" id="visualizationsGrid">
        {% for viz in visualizations %}
        <div class="col-md-6 mb-4 viz-card" data-type="{{ viz.type }}">
            <div class="card visualization-card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5>{{ viz.title }}</h5>
                    <button class="btn btn-sm btn-outline-primary download-btn" 
                            data-image="{{ viz.img }}" 
                            data-title="{{ viz.title }}">
                        <i class="bi bi-download"></i> Download
                    </button>
                </div>
                <div class="card-body">
                    <img src="data:image/png;base64,{{ viz.img }}" 
                         alt="{{ viz.title }}"
                         class="img-fluid chart-img"
                         data-title="{{ viz.title }}"
                         style="cursor: pointer;">
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="mt-4">
        <a href="{{ url_for('visualization') }}" class="back-button">
            <svg height="20" width="20" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1024 1024"><path fill="#ffffff" d="M874.690416 495.52477c0 11.2973-9.168824 20.466124-20.466124 20.466124l-604.773963 0 188.083679 188.083679c7.992021 7.992021 7.992021 20.947078 0 28.939099-4.001127 3.990894-9.240455 5.996574-14.46955 5.996574-5.239328 0-10.478655-1.995447-14.479783-5.996574l-223.00912-223.00912c-3.837398-3.837398-5.996574-9.046027-5.996574-14.46955 0-5.433756 2.159176-10.632151 5.996574-14.46955l223.019353-223.029586c7.992021-7.992021 20.957311-7.992021 28.949332 0 7.992021 8.002254 7.992021 20.957311 0 28.949332l-188.073446 188.073446 604.753497 0C865.521592 475.058646 874.690416 484.217237 874.690416 495.52477z"></path></svg>
            <span>Back</span>
        </a>
    </div>
    <div class="modal fade" id="chartModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="chart-container">
                        <!-- Container for both 2D and 3D plots -->
                        <div id="modal-plot-container" style="width:100%; height:80vh;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>



<script src="{{url_for('static', filename='js/dashboard.js')}}"></script>
{% endblock %}
