{% extends "base.html" %}
{% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Messages</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Arial', sans-serif;
        }
        .container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem;
            margin-top: 2rem;
        }
        .client-item {
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
            margin-bottom: 0.5rem;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .client-item:hover {
            background-color: #e9ecef;
            transform: translateX(10px);
        }
        .client-item.active {
            background-color: #e9ecef;
            border-left-color: #0056b3;
        }
        .message-details {
            display: none;
            background-color: #f1f3f5;
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1rem;
        }
        .no-messages {
            text-align: center;
            color: #6c757d;
            padding: 2rem;
        }
    </style>
{% endblock %}
{% block content %}
    <div class="container">
        <h1 class="text-center mb-4" style="margin-top: 50px;">
            <i class="bi bi-envelope-paper me-2"></i>Client Messages
        </h1>

        <div class="row">
            <div class="col-md-4">
                <div class="client-list">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="client-item" 
                                 data-name="{{ message[0] }}"
                                 data-email="{{ message[1] }}"
                                 data-subject="{{ message[2] }}"
                                 data-message="{{ message[3] }}">
                                {{ message[0] }}
                            </div>
                        {% endfor %}
                    {% else %}
                        <div class="no-messages">
                            <i class="bi bi-inbox fs-1 mb-3"></i>
                            <p>No messages found.</p>
                        </div>
                    {% endif %}
                </div>
            </div>
            
            <div class="col-md-8">
                <div id="messageDetails" class="message-details">
                    <h4 id="detailName" class="mb-3"></h4>
                    <p><strong>Email:</strong> <span id="detailEmail"></span></p>
                    <p><strong>Subject:</strong> <span id="detailSubject"></span></p>
                    <p><strong>Message:</strong></p>
                    <p id="detailMessage"></p>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="{{ url_for('analyse') }}" class="btn btn-primary">
                <i class="bi bi-arrow-left me-2"></i>Back to Analyse page
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const clientItems = document.querySelectorAll('.client-item');
            const messageDetails = document.getElementById('messageDetails');
            const detailName = document.getElementById('detailName');
            const detailEmail = document.getElementById('detailEmail');
            const detailSubject = document.getElementById('detailSubject');
            const detailMessage = document.getElementById('detailMessage');
    
            // Initially hide message details
            messageDetails.style.display = 'none';
    
            clientItems.forEach(item => {
                item.addEventListener('click', function() {
                    // Si le message cliqué est déjà actif, on cache les détails
                    if (this.classList.contains('active')) {
                        this.classList.remove('active');
                        messageDetails.style.display = 'none';
                    } else {
                        // Remove active class from all items
                        clientItems.forEach(i => i.classList.remove('active'));
                        
                        // Add active class to clicked item
                        this.classList.add('active');
    
                        // Get message details
                        const name = this.getAttribute('data-name');
                        const email = this.getAttribute('data-email');
                        const subject = this.getAttribute('data-subject');
                        const message = this.getAttribute('data-message');
                        
                        // Populate message details
                        detailName.textContent = name;
                        detailEmail.textContent = email;
                        detailSubject.textContent = subject;
                        detailMessage.textContent = message;
    
                        // Show message details
                        messageDetails.style.display = 'block';
                    }
                });
            });
        });
    </script>
    
{% endblock %}
